services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: gonteractive
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: gonteractive
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    restart: unless-stopped

  app:
    build: .
    image: gonteractive:latest
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    env_file: .env
    volumes:
      - data:/data
      - codex:/home/app/.codex
    restart: unless-stopped

volumes:
  ts-state:
  data:
  codex:
